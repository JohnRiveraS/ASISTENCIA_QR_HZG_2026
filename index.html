<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistencia QR</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>

<h2>Asistencia QR</h2>

<input id="dni" placeholder="DNI docente">

<button onclick="validar()">
  VALIDAR
</button>

<div id="info"></div>

<div id="config" style="display:none;">

  <div id="secundaria" style="display:none;">

    <select id="grado" onchange="cargarSecciones()">
      <option>PRIMERO</option>
      <option>SEGUNDO</option>
      <option>TERCERO</option>
      <option>CUARTO</option>
      <option>QUINTO</option>
    </select>

    <select id="seccion"></select>

  </div>

  <select id="area">
    <option value="MATE">MATE</option>
    <option value="COM">COM</option>
    <option value="CCSS">CCSS</option>
    <option value="CT">CT</option>
    <option value="DPCC">DPCC</option>
    <option value="ING">ING</option>
    <option value="ART">ART</option>
    <option value="EPT">EPT</option>
    <option value="REG">REG</option>
    <option value="FIS">FIS</option>
  </select>

  <button onclick="iniciar()">
    INICIAR ASISTENCIA
  </button>

</div>

<div id="scanner" style="width:300px;"></div>

<script>

let contexto = {};
let qr;
let scannerActivo = false;

const URL_SCRIPT =
"https://script.google.com/macros/s/AKfycbyvGctwZ_IskT2M9kSC68moempT5GV29cS0nxAyGo1FhVTlDCmnP432gcUXbuul7jaD/exec";

function validar() {

  let dni = document.getElementById("dni").value;

  if (!dni) {
    alert("Ingrese DNI");
    return;
  }

  fetch(URL_SCRIPT + "?dni=" + dni)

    .then(response => response.json())

    .then(data => {

      if (!data) {
        alert("Docente no encontrado");
        return;
      }

      contexto.docente = data.dni;
      contexto.nivel = data.nivel;

      document.getElementById("info").innerHTML = data.nombre;

      document.getElementById("config").style.display = "block";

      if (data.nivel == "SECUNDARIA") {

        document.getElementById("secundaria").style.display = "block";

        cargarSecciones();

      } else {

        contexto.grado = data.grado;
        contexto.seccion = data.seccion;

      }

    })

    .catch(error => {

      alert("Error de conexión");

      console.log(error);

    });

}

function cargarSecciones() {

  let grado = document.getElementById("grado").value;

  let select = document.getElementById("seccion");

  let opciones =
    (grado == "PRIMERO")
      ? ["A", "B", "C", "D"]
      : ["A", "B", "C"];

  select.innerHTML = "";

  opciones.forEach(s => {

    let op = document.createElement("option");

    op.value = s;
    op.text = s;

    select.appendChild(op);

  });

}

function iniciar() {

  contexto.area =
    document.getElementById("area").value;

  if (contexto.nivel == "SECUNDARIA") {

    contexto.grado =
      document.getElementById("grado").value;

    contexto.seccion =
      document.getElementById("seccion").value;

  }

  iniciarScanner();

}

function iniciarScanner() {

  if (scannerActivo) return;

  scannerActivo = true;

  document.getElementById("scanner").innerHTML = "";

  qr = new Html5Qrcode("scanner");

  qr.start(

    { facingMode: "environment" },

    {
      fps: 10,
      qrbox: 250
    },

    async (decodedText) => {

      await qr.stop();

      scannerActivo = false;

      // 🔥 LIMPIAR QR
      let dni = decodedText.trim();

      dni = dni.replace("DNI:", "");
      dni = dni.replace(/\s/g, "");

      registrar(dni);

    }

  );

}

async function registrar(dni) {

  try {

    const response = await fetch(URL_SCRIPT, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        dni: dni,
        contexto: contexto
      })

    });

    const res = await response.json();

    console.log(res);

    document.getElementById("info").innerHTML = `

      <div style="
        background:white;
        padding:20px;
        border-radius:10px;
        margin-top:20px;
        text-align:center;
      ">

        <h2>
          ${res.ok ? "REGISTRADO" : "OBSERVACION"}
        </h2>

        <p style="font-size:20px;">
          ${res.msg}
        </p>

        <button onclick="continuarEscaneo()">
          SIGUIENTE
        </button>

        <button
          onclick="finalizarAsistencia()"
          style="
            background:red;
            color:white;
            margin-top:10px;
          "
        >
          FINALIZAR
        </button>

      </div>

    `;

  }

  catch (error) {

    alert("Error: " + error);

    console.log(error);

  }

}

function continuarEscaneo() {

  document.getElementById("info").innerHTML = "";

  iniciarScanner();

}

async function finalizarAsistencia() {

  if (qr) {

    try {

      await qr.stop();

    } catch (e) {}

  }

  scannerActivo = false;

  document.getElementById("scanner").innerHTML = "";

  document.getElementById("info").innerHTML =
    "Asistencia finalizada";

}

</script>

</body>
</html>
